name: Lint
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    name: Lint Code and Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set Up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Lint Code and Documentation
        run: npm run lint
