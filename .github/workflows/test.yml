name: Test
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Test on Node.js ${{ matrix.entry.node }} (${{ matrix.entry.os }})
    runs-on: ${{ matrix.entry.os }}
    strategy:
      fail-fast: false
      matrix:
        entry:
          - { node: '24', os: ubuntu-latest }
          - { node: '26', os: ubuntu-latest }
          - { node: '26', os: macos-latest }
          - { node: '26', os: windows-latest }
    steps:
      - name: Check Out Source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set Up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.entry.node }}
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Run Tests with Coverage
        run: npm run test:coverage
      - name: Upload Coverage
        if: matrix.entry.node == '26' && matrix.entry.os == 'ubuntu-latest'
        uses: coverallsapp/github-action@v2.3.8
        with:
          github-token: ${{ github.token }}
          file: coverage/lcov.info
          format: lcov
